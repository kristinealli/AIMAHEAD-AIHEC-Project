<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Unraveling the Patterns</title>
  <desc id="desc">Three woven turquoise and copper threads unravel into separate data points.</desc>
  <rect width="64" height="64" rx="15" fill="#102B36"/>
  <!-- The repeating interlaced paths evoke a woven pattern and tangled data. -->
  <path d="M11 17 C19 17 19 28 27 28 S35 17 43 17" fill="none" stroke="#78D6CF" stroke-width="5" stroke-linecap="round"/>
  <path d="M11 31 C19 31 19 20 27 20 S35 31 43 31" fill="none" stroke="#DCA878" stroke-width="5" stroke-linecap="round"/>
  <path d="M11 45 C19 45 19 34 27 34 S35 45 43 45" fill="none" stroke="#78D6CF" stroke-width="5" stroke-linecap="round"/>
  <!-- Deliberate crossovers make the lines read as interwoven. -->
  <path d="M23.7 26.15 C25.0 27.2 26 28 27 28 C29 28 30 27.4 31.1 26.3" fill="none" stroke="#78D6CF" stroke-width="5" stroke-linecap="round"/>
  <path d="M23.7 35.65 C25 34.6 26 34 27 34 C29 34 30 34.8 31.1 35.7" fill="none" stroke="#78D6CF" stroke-width="5" stroke-linecap="round"/>
  <!-- Unravel into an emerging constellation of observations. -->
  <path d="M43 17 Q47 17 49 13" fill="none" stroke="#78D6CF" stroke-width="4" stroke-linecap="round"/>
  <path d="M43 31 Q48 31 51 28" fill="none" stroke="#DCA878" stroke-width="4" stroke-linecap="round"/>
  <path d="M43 45 Q47 45 50 49" fill="none" stroke="#78D6CF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="53" cy="10" r="3" fill="#78D6CF"/>
  <circle cx="55" cy="25" r="2.6" fill="#DCA878"/>
  <circle cx="54" cy="52" r="3" fill="#78D6CF"/>
</svg>
